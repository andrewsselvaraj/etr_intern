<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organisation Entry</title>
    
</head>
<body>
    <div class="heading">
        <h1>Organisation Entry</h1>
        <p>Entter organisation details.</p>
        <form action="">
        <label>Organisation ID</label>
        <input type="text">

        <label>Organisation Name</label>
        <input type="text">

        <label>Organisation Email</label>
        <input type="email">

        <label>Status</label>

        <select>
            <option>ACTIVE</option>
            <option>INACTIVE</option>
        </select>

        <label>Created User</label>
        <input type="text">

        <label>Updated User</label>
        <input type="text">
    </form>

    <button type="submit">Save</button>
    <button type="reset">Reset</button>
    </div>

    
</body>
</html>

    body{
        margin:0px;

        background:white;

    border-radius:10px;
    }

    h1{
        text-align:center;

    p{
        text-align:center;

    }
    label{
