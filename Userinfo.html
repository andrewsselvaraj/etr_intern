<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Information</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#FFF8F2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:950px;
    background:#fff;
    display:flex;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,0.15);
}

/* LEFT SIDE */

.left{
    width:65%;
    padding:35px;
}

.left h1{
    color:#444;
    margin-bottom:8px;
}

.left p{
    color:#777;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:600;
    color:#555;
}

input,select{
    width:100%;
    height:45px;
    border:1px solid #ddd;
    border-radius:8px;
    padding:0 15px;
    outline:none;
    transition:.3s;
    font-size:15px;
}

input:focus,
select:focus{
    border:1px solid #F4A261;
}

.row{
    display:flex;
    gap:15px;
}

.row div{
    flex:1;
}

button{
    width:100%;
    height:48px;
    border:none;
    border-radius:8px;
    margin-top:28px;
    background:#F4A261;
    color:#fff;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#E76F51;
}

/* RIGHT SIDE */

.right{
    width:35%;
    background:#F4A261;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:35px;
}

.right h2{
    font-size:32px;
    margin-bottom:35px;
}

.card{
    display:flex;
    align-items:center;
    background:rgba(255,255,255,0.2);
    border-radius:12px;
    padding:16px;
    margin-bottom:18px;
}

.icon{
    width:50px;
    height:50px;
    border-radius:50%;
    background:white;
    color:#F4A261;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
    margin-right:15px;
}

.card h3{
    margin-bottom:5px;
}

.card p{
    color:white;
    font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<!-- LEFT -->

<div class="left">

<h1>User Information</h1>
<p>Enter and manage user details.</p>

<label>User ID</label>
<input type="text" placeholder="USR001">

<label>Organisation</label>
<select>
<option>Select Organisation</option>
<option>Jo Technologies</option>
<option>ABC School Management</option>
<option>Varun Finance</option>
</select>

<label>Username</label>
<input type="text" placeholder="Enter Username">

<label>Email</label>
<input type="email" placeholder="Enter Email">

<label>Role</label>
<select>
<option>Select Role</option>
<option>Admin</option>
<option>Manager</option>
<option>User</option>
</select>

<label>Status</label>
<select>
<option>ACTIVE</option>
<option>INACTIVE</option>
</select>

<div class="row">

<div>
<label>Created User</label>
<input type="text" placeholder="Created By">
</div>

<div>
<label>Updated User</label>
<input type="text" placeholder="Updated By">
</div>

</div>

<button>
<i class="fa-solid fa-paper-plane"></i>
 Submit
</button>

</div>

<!-- RIGHT -->

<div class="right">

<h2>Need Help?</h2>

<div class="card">

<div class="icon">
<i class="fa-solid fa-envelope"></i>
</div>

<div>
<h3>Email Us</h3>
<p>support@company.com</p>
</div>

</div>

<div class="card">

<div class="icon">
<i class="fa-solid fa-phone"></i>
</div>

<div>
<h3>Contact Us</h3>
<p>+91 90437 2895</p>
</div>

</div>

</div>

</div>

</body>
</html>
